# Paket yang boleh menjalankan skrip build saat install.
#
# pnpm memblokir skrip pasca-install secara bawaan sejak v10. Paket yang tidak
# terdaftar di sini membuat `pnpm install` berhenti dengan
# ERR_PNPM_IGNORED_BUILDS — itu yang menggagalkan build di Vercel.
#
# SENGAJA ditulis dalam DUA format karena nama kuncinya berubah antar versi,
# dan mesin build (Vercel) belum tentu memakai versi yang sama dengan mesin
# pengembang:
#   - `allowBuilds`           dibaca pnpm 12
#   - `onlyBuiltDependencies` dibaca pnpm 10/11
# Versi yang tidak mengenal salah satu kunci akan mengabaikannya tanpa error,
# jadi menulis keduanya aman. Kalau menambah paket, tambahkan di KEDUA daftar.
#
# - prisma & @prisma/engines : mengunduh engine biner; tanpa ini Prisma Client
#                              tidak bisa dipakai sama sekali.
# - esbuild & unrs-resolver  : mengunduh biner sesuai platform, dipakai tsx
#                              (seed) dan resolver ESLint.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
  - unrs-resolver
